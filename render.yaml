# Render Blueprint: https://dashboard.render.com → New → Blueprint
# Or: New → Web Service → connect this GitHub repo → Docker

services:
  - type: web
    name: ai-meeting-assistant
    runtime: docker
    # starter recommended — free tier often OOM with Whisper/torch
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: WHISPER_MODEL
        value: tiny
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "600"
      - key: GUNICORN_THREADS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FORCE_HTTPS
        value: "true"
    # Keep meeting history across deploys (paid plans)
    disk:
      name: ai-meeting-assistant-data
      mountPath: /app/data
      sizeGB: 2
