# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect this repo on Render → New → Blueprint, or create a Web Service from Dockerfile.

services:
  - type: web
    name: meetmind
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: WHISPER_MODEL
        value: tiny
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "600"
      - key: GUNICORN_THREADS
        value: "2"
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: meetmind-data
      mountPath: /app/data
      sizeGB: 2
